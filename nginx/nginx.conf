events { worker_connections 4096; }
http {
  resolver 127.0.0.11 valid=10s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  upstream api_backend {
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
    server app3:3000 max_fails=2 fail_timeout=5s;
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_pass http://api_backend;
    }
    location /health { proxy_pass http://api_backend; }
    location /ready { proxy_pass http://api_backend; }
    location /metrics { proxy_pass http://api_backend; }
    location / { try_files $uri /index.html; }
  }
}