<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SurgeShield | Resilient Event Platform</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7486;--line:#e5e8ef;--p:#635bff;--p2:#8a63ff;--ok:#16a06b;--warn:#d88a16;--bad:#dc5260;--nav:#12182b;--shadow:0 14px 40px rgba(24,34,61,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial}.app{min-height:100vh;display:flex}.side{width:250px;background:var(--nav);color:#dce2ef;position:fixed;inset:0 auto 0 0;padding:22px 15px;z-index:20}.logo{display:flex;gap:10px;align-items:center;font-weight:900;font-size:19px;padding:7px 10px 28px}.logoMark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9faac0;text-align:left;padding:12px 14px;border-radius:11px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:#202943;color:#fff}.sideFoot{position:absolute;bottom:20px;left:15px;right:15px}.main{margin-left:250px;width:calc(100% - 250px);padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.kicker{font-size:12px;color:var(--p);font-weight:800;letter-spacing:.08em}.title{font-size:30px;font-weight:900;margin:4px 0}.sub{color:var(--muted);font-size:14px}.user{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:14px;display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:11px;background:#ecebff;color:var(--p);display:grid;place-items:center;font-weight:900}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:13px}.value{font-size:30px;font-weight:900;margin:7px 0}.small{font-size:12px;color:var(--muted)}.section{margin-top:20px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionTitle{font-size:18px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{color:white;background:linear-gradient(135deg,var(--p),var(--p2))}.secondary{color:var(--p);background:#eeedff}.danger{color:var(--bad);background:#fff0f2}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.event{overflow:hidden;padding:0}.cover{height:105px;background:linear-gradient(120deg,#222a65,#7764e7);position:relative}.cover:after{content:"";position:absolute;right:25px;top:20px;width:65px;height:65px;border:14px solid rgba(255,255,255,.13);border-radius:50%}.eventBody{padding:19px}.eventName{font-size:18px;font-weight:900}.meta{font-size:13px;color:var(--muted);margin:7px 0 13px}.bar{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:10px}.eventFoot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:8px}.pill{font-size:11px;font-weight:900;padding:5px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}.green{background:#e9f8f1;color:var(--ok)}.orange{background:#fff4e0;color:var(--warn)}.red{background:#ffedf0;color:var(--bad)}.blue{background:#edf2fe;color:var(--p)}.services{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.service{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.red{background:var(--bad)}.dot.orange{background:var(--warn)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted)}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10162a,#303a7c)}.authBox{width:min(450px,92vw);background:#fff;padding:31px;border-radius:23px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:800}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;font-size:14px}.field input:focus,.field select:focus{border-color:var(--p)}.full{width:100%}.demo{background:#f4f5ff;padding:12px;border-radius:11px;font-size:12px;margin-top:13px}.switch{text-align:center;color:var(--muted);font-size:13px;margin-top:15px;cursor:pointer}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:100}.modalBg{position:fixed;inset:0;background:rgba(9,13,25,.58);display:grid;place-items:center;z-index:90}.modal{width:min(520px,92vw);background:white;border-radius:20px;padding:25px}.close{float:right;border:0;border-radius:50%;width:32px;height:32px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:28px}.hero{padding:25px;background:linear-gradient(120deg,#191f4d,#5c52c9);color:white;border-radius:20px;box-shadow:var(--shadow);margin-bottom:20px}.hero h2{font-size:26px;margin:0 0 7px}.hero p{opacity:.82;margin:0}.two{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.demoBox{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.demoHead{font-weight:900;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
@media(max-width:1050px){.grid4,.services{grid-template-columns:repeat(2,1fr)}.events,.two{grid-template-columns:1fr}}
@media(max-width:720px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:18px}.nav{display:flex;overflow:auto}.sideFoot{display:none}.top{align-items:flex-start;gap:10px}.user{display:none}.grid4,.services{grid-template-columns:1fr 1fr}}
.hidden{display:none!important}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
let token=localStorage.getItem("ss_token"), user=JSON.parse(localStorage.getItem("ss_user")||"null");
let currentServedBy = "app";
let autoPollTimer = null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){$("toast").textContent=m;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3000)}

async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),"Content-Type":"application/json"};
  if(token) opt.headers.Authorization="Bearer "+token;
  let r=await fetch("/api"+path,opt);
  let served=r.headers.get("x-served-by");
  if(served) updateServedBy(served);
  let d=await r.json().catch(()=>({}));
  if(d.servedBy) updateServedBy(d.servedBy);
  if(!r.ok) {
    let err = new Error(d.message||"Request failed");
    err.status = r.status;
    err.data = d;
    throw err;
  }
  return d;
}

function updateServedBy(name){
  currentServedBy = name;
  let b=$("nodeBadge");
  if(b) b.textContent = "Node: " + name;
}

function authScreen(register=false){
  if(autoPollTimer) { clearInterval(autoPollTimer); autoPollTimer=null; }
  $("root").innerHTML=`<div class="auth"><div class="authBox"><div class="logo" style="color:#172033;padding:0 0 20px"><span class="logoMark">S</span> SurgeShield</div><h1>${register?"Create your account":"Sign in to SurgeShield"}</h1><p class="sub">${register?"Register as a real Attendee or Organizer.":"Enter your email and password to access your portal."}</p>${register?`<div class="field"><label>Full name</label><input id="name" placeholder="e.g. Jane Doe" autocomplete="name"></div>`:""}<div class="field"><label>Email address</label><input id="email" type="email" placeholder="name@domain.com" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Min. 8 characters" autocomplete="${register?'new-password':'current-password'}"></div>${register?`<div class="field"><label>Role</label><select id="role"><option value="ATTENDEE">Attendee (Book events & view history)</option><option value="ORGANIZER">Organizer (Manage events & operations)</option></select></div>`:""}<button class="btn primary full" onclick="${register?"doRegister()":"doLogin()"}">${register?"Create account":"Sign in"}</button><div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:center"><div class="small" style="margin-bottom:8px;color:var(--muted)">Need a test shortcut?</div><div style="display:flex;gap:8px;justify-content:center"><button type="button" class="btn secondary" style="font-size:11px;padding:6px 10px" onclick="fillDemo('attendee')">Attendee Demo</button><button type="button" class="btn secondary" style="font-size:11px;padding:6px 10px" onclick="fillDemo('organizer')">Organizer Demo</button></div></div><div class="switch" onclick="authScreen(${!register})">${register?"Already have an account? Sign in":"New user? Create a new account"}</div></div></div>`;
}

function fillDemo(type){
  if(type==='attendee'){
    $('email').value = 'attendee@surgeshield.local';
    $('password').value = 'Password@123';
  } else {
    $('email').value = 'organizer@surgeshield.local';
    $('password').value = 'Password@123';
  }
  toast(`Demo credentials loaded for ${type}`);
}

async function doLogin(){
  let em = $("email").value.trim(), pw = $("password").value;
  if(!em || !pw) { toast("Please enter both email and password"); return; }
  try{
    let d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:em,password:pw})});
    toast(`Signed in as ${d.user.name}`);
    save(d);
  }catch(e){toast(e.message)}
}

async function doRegister(){
  let nm = $("name")?.value.trim()||"", em = $("email").value.trim(), pw = $("password").value, rl = $("role").value;
  if(!nm || !em || !pw) { toast("Name, email and password are required"); return; }
  if(pw.length < 8) { toast("Password must be at least 8 characters long"); return; }
  try{
    let d=await api("/auth/register",{method:"POST",body:JSON.stringify({name:nm,email:em,password:pw,role:rl})});
    toast(`Account created for ${d.user.name}`);
    save(d);
  }catch(e){toast(e.message)}
}

function save(d){token=d.token;user=d.user;localStorage.setItem("ss_token",token);localStorage.setItem("ss_user",JSON.stringify(user));render("overview")}
function logout(){if(autoPollTimer) { clearInterval(autoPollTimer); autoPollTimer=null; }localStorage.clear();token=null;user=null;toast("Signed out");authScreen()}

function shell(page){
  $("root").innerHTML=`<div class="app"><aside class="side"><div class="logo"><span class="logoMark">S</span> SurgeShield</div><div class="nav"><button class="${page==="overview"?"active":""}" onclick="render('overview')">⌂ Overview</button><button class="${page==="events"?"active":""}" onclick="render('events')">◫ Events</button>${user.role==="ATTENDEE"?`<button class="${page==="registrations"?"active":""}" onclick="render('registrations')">✓ My Registrations</button>`:`<button class="${page==="admin"?"active":""}" onclick="render('admin')">▦ Operations</button>`}<button class="${page==="health"?"active":""}" onclick="render('health')">◉ System Health</button></div><div class="sideFoot"><button class="btn secondary full" onclick="logout()">↪ Sign out</button></div></aside><main class="main"><div class="top"><div><div class="kicker">${user.role} PORTAL</div><div class="title">${page==="admin"?"Operations Dashboard":page==="health"?"System Health":page==="registrations"?"My Registrations":page[0].toUpperCase()+page.slice(1)}</div><div class="sub">Reliable registration, concurrency protection & asynchronous resilience.</div></div><div class="user"><span id="nodeBadge" class="pill green" title="Last API Node handled by Nginx">Node: ${currentServedBy}</span><div class="avatar">${esc(user.name[0]).toUpperCase()}</div><div><b>${esc(user.name)}</b><div class="small">${user.email}</div></div></div></div><div id="content"></div></main></div>`;
}

async function render(page){
  if(autoPollTimer) { clearInterval(autoPollTimer); autoPollTimer=null; }
  if(!user) return authScreen();
  shell(page);
  try{
    if(page==="overview") await overview();
    if(page==="events") await eventsPage();
    if(page==="registrations") await regsPage();
    if(page==="admin") await adminPage();
    if(page==="health") await healthPage();
  }catch(e){toast(e.message)}
}

async function overview(){
  let d=await api("/events"),es=d.events,total=es.reduce((a,e)=>a+Number(e.total_seats),0),avail=es.reduce((a,e)=>a+Number(e.available_seats),0),used=total-avail;
  $("content").innerHTML=`<div class="hero"><h2>Event registration, engineered for surges.</h2><p>Nginx load balancing • 3 API nodes • PostgreSQL row locks • Redis cache • BullMQ async processing</p></div><div class="grid4">${stat("Live events",es.length,"Available now")}${stat("Seats used",used,`${Math.round(used/Math.max(total,1)*100)}% of capacity`)}${stat("Seats available",avail,"Protected inventory")}${stat("Load Balanced Nodes",3,`Active: ${currentServedBy}`)}</div><div class="section"><div class="sectionHead"><div><div class="sectionTitle">Featured events</div><div class="sub">Book individual or group seats with concurrency protection.</div></div><button class="btn secondary" onclick="render('events')">View all</button></div><div class="events">${es.map(card).join("")}</div></div><div class="section card"><div class="sectionTitle">Resilience controls</div><div class="services" style="margin-top:14px">${service("Nginx","Load balance (3 nodes) + rate limit")}${service("PostgreSQL","Row-level locking (FOR UPDATE)")}${service("Redis","5s cache + BullMQ broker")}${service("BullMQ","Asynchronous notifications")}</div></div>`;
}

function stat(a,b,c){return `<div class="card"><div class="label">${a}</div><div class="value">${b}</div><div class="small">${c}</div></div>`}
function service(a,b,bad=false,warn=false){return `<div class="service"><span class="dot ${bad?"red":warn?"orange":""}"></span><b>${a}</b><div class="small">${b}</div></div>`}

function card(e){
  let pct=Number(e.fill_percent)||0;
  let isSoldOut=Number(e.available_seats)<=0;
  return `<div class="card event"><div class="cover"></div><div class="eventBody"><div class="eventName">${esc(e.name)}</div><div class="meta">📍 ${esc(e.venue)} &nbsp; • &nbsp; 📅 ${new Date(e.starts_at).toLocaleString()}</div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><b>${e.available_seats} seats left</b><span>${Number(e.total_seats)-Number(e.available_seats)}/${e.total_seats} registered</span></div><div class="bar"><span style="width:${Math.min(100,pct)}%"></span></div><div class="eventFoot"><span class="pill ${isSoldOut?"red":pct>80?"orange":"green"}">${isSoldOut?"SOLD OUT":pct>80?"HIGH DEMAND":"AVAILABLE"}</span><div style="display:flex;align-items:center;gap:6px"><label style="font-size:11px;font-weight:700;color:var(--muted)">Qty:</label><input id="qty-${e.id}" type="number" min="1" max="${Math.max(1,Math.min(10,e.available_seats))}" value="1" style="width:48px;padding:6px;border-radius:8px;border:1px solid var(--line);text-align:center;font-weight:700" ${isSoldOut?"disabled":""}><button class="btn primary" onclick="registerEvent(${e.id})" ${isSoldOut?"disabled":""}>${isSoldOut?"Sold Out":"Register"}</button></div></div></div></div>`;
}

async function registerEvent(id){
  if(user.role!=="ATTENDEE"){toast("Sign in as an attendee to register");return}
  let qtyInput=$(`qty-${id}`);
  let qty=qtyInput ? parseInt(qtyInput.value,10) : 1;
  if(isNaN(qty)||qty<1){toast("Please enter a valid ticket quantity (>= 1)");return}
  try{
    let d=await api(`/events/${id}/register`,{
      method:"POST",
      headers:{"Idempotency-Key":crypto.randomUUID()},
      body:JSON.stringify({quantity:qty})
    });
    toast(`Confirmed ${qty} ticket(s) • Notification queued`);
    render("registrations");
  }catch(e){toast(e.message)}
}

async function eventsPage(){
  let d=await api("/events");
  $("content").innerHTML=`<div class="sectionHead"><div><div class="sectionTitle">All Events</div><div class="sub">Select ticket quantity and register securely with zero overbooking risk.</div></div>${user.role==="ORGANIZER"?`<button class="btn primary" onclick="createModal()">+ Create Event</button>`:""}</div><div class="events">${d.events.map(card).join("")}</div>`;
}

async function regsPage(){
  let d=await api("/my-registrations");
  $("content").innerHTML=`<div class="card"><div class="sectionHead"><div class="sectionTitle">Your Registrations</div><button class="btn secondary" onclick="render('registrations')">↻ Refresh Status</button></div><table class="table"><thead><tr><th>ID</th><th>Event</th><th>Tickets</th><th>Venue</th><th>Date</th><th>Status</th><th>Async Notification</th></tr></thead><tbody>${d.registrations.length?d.registrations.map(r=>{
    let notifColor = r.notification_status==="SENT"?"green":r.notification_status==="PROCESSING"?"orange":"blue";
    return `<tr><td>#${r.id}</td><td><b>${esc(r.name)}</b></td><td><span class="pill blue">${r.quantity||1} ticket${(r.quantity||1)>1?"s":""}</span></td><td>${esc(r.venue)}</td><td>${new Date(r.created_at).toLocaleString()}</td><td><span class="pill green">${r.status}</span></td><td><span class="pill ${notifColor}">${r.notification_status}</span></td></tr>`;
  }).join(""):`<tr><td colspan="7" class="empty">No registrations yet. Browse events to register!</td></tr>`}</tbody></table></div>`;
}

async function adminPage(){
  let d=await api("/admin/dashboard");
  let q=d.queue;
  let sc=d.autoscaling;
  let isWorkerOffline = d.workerStatus==="STOPPED";

  $("content").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;background:var(--card);padding:14px 18px;border-radius:14px;border:1px solid var(--line)"><div><b>Environment Operations</b><div class="small">Reset platform data, manage live capacity, and monitor cluster health.</div></div><button class="btn danger" onclick="resetEntireSystem()">⚠️ Reset All Platform Data</button></div>

  <div class="grid4">${stat("Registrations",d.summary.registrations,"All events")}${stat("Confirmed",d.summary.confirmed,"Database committed")}${stat("BullMQ Queue Depth",q.depth,`Active: ${q.bullmqActive}, Waiting: ${q.bullmqWaiting}`)}${stat("Simulated Workers",`${sc.currentWorkers} / ${sc.maxWorkers}`,`Status: ${sc.status}`)}</div>

  <!-- Live Concurrency Test Control -->
  <div class="section card"><div class="sectionHead"><div><div class="sectionTitle">⚡ Concurrency Control Live Demo</div><div class="sub">Demonstrate PostgreSQL SELECT ... FOR UPDATE row locking across simultaneous requests.</div></div><button class="btn secondary" onclick="resetConcurrencyEvent()">Reset Demo Event (5 Seats)</button></div>
  <p style="font-size:13px;color:var(--muted);margin:0 0 14px">Sends 10 concurrent requests simultaneously through Nginx to all 3 Node.js instances against an event with 5 seats. Watch row locking prevent overbooking.</p>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><button id="btnRunConcurrency" class="btn primary" onclick="runLiveConcurrencyDemo()">🚀 Run Concurrency Test (10 Requests)</button><span id="concurrencyStatus" style="font-size:13px;font-weight:700;color:var(--muted)">Ready to test</span></div>
  <div id="concurrencyResult" class="demoBox hidden"></div>
  </div>

  <!-- Auto-scaling Simulation Control -->
  <div class="section card"><div class="sectionHead"><div><div class="sectionTitle">📈 Auto-scaling Simulation</div><div class="sub">Dynamic worker pool sizing based on BullMQ queue backlog.</div></div><span class="pill ${sc.status==='SCALING_UP'?'orange':'blue'}">${sc.status}</span></div>
  <p style="font-size:13px;color:var(--muted);margin:0 0 14px"><b>Simulated Worker Pool:</b> Base = 2 workers. As queue backlog spikes during traffic surges, virtual pool size scales up to 10 workers, then drains automatically.</p>
  <div style="display:flex;gap:12px;align-items:center"><button id="btnSurge" class="btn primary" onclick="triggerTrafficSurge()">⚡ Simulate Traffic Surge (+25 Jobs)</button><span id="surgeFeedback" style="font-size:13px;font-weight:700;color:var(--muted)">Base pool: 2 workers</span></div>
  </div>

  <!-- Rate Limiter & Load Balancer Probe -->
  <div class="section grid3" style="margin-top:20px">
    <div class="card"><div class="sectionTitle">🛡️ Rate Limiting Demo</div><p class="small" style="margin:8px 0 12px">Limit: 5 req / 10s. Excessive bursts receive HTTP 429 Too Many Requests.</p><button id="btnRateLimit" class="btn secondary full" onclick="runRateLimitTest()">Test Rate Limiter (10 Fast Requests)</button><div id="rateLimitResult" class="small" style="margin-top:10px;font-family:monospace;white-space:pre-line"></div></div>
    <div class="card"><div class="sectionTitle">🔀 Load Balancer Distribution</div><p class="small" style="margin:8px 0 12px">Nginx round-robins requests across app1, app2, and app3.</p><button id="btnProbe" class="btn secondary full" onclick="runLoadBalancerProbe()">Probe Cluster (12 Requests)</button><div id="probeResult" class="small" style="margin-top:10px;font-family:monospace;white-space:pre-line"></div></div>
    <div class="card"><div class="sectionTitle">🔄 Worker Failure Recovery</div><p class="small" style="margin:8px 0 12px">Worker Status: <b style="color:${isWorkerOffline?'var(--bad)':'var(--ok)'}">${d.services.worker}</b></p><div class="small" style="color:var(--muted);line-height:1.4">When worker is stopped (<code>docker compose stop worker</code>), registrations continue and jobs remain safe in Redis. When restarted, jobs process without loss.</div></div>
  </div>

  <div class="section card"><div class="sectionHead"><div><div class="sectionTitle">Event Capacity & Locks</div><div class="sub">View real-time seat inventory or reset capacities to initial starting counts.</div></div><div style="display:flex;gap:8px"><button class="btn secondary" onclick="resetAllEventCapacities()">↺ Reset All Seats</button><button class="btn primary" onclick="createModal()">+ Create Event</button></div></div><table class="table"><thead><tr><th>ID</th><th>Event</th><th>Available</th><th>Registered</th><th>Fill</th><th>Status</th><th>Action</th></tr></thead><tbody>${d.events.map(e=>`<tr><td>#${e.id}</td><td><b>${esc(e.name)}</b></td><td>${e.available_seats}/${e.total_seats}</td><td>${e.registered}</td><td>${e.fill_percent}%</td><td><span class="pill ${e.available_seats==0?"red":Number(e.fill_percent)>80?"orange":"green"}">${e.available_seats==0?"SOLD OUT":"HEALTHY"}</span></td><td><button class="btn secondary" style="font-size:11px;padding:4px 8px" onclick="resetSingleEventCapacity(${e.id})">↺ Reset Seats</button></td></tr>`).join("")}</tbody></table></div>

// Live Concurrency Test
async function runLiveConcurrencyDemo(){
  let btn=$("btnRunConcurrency");
  let status=$("concurrencyStatus");
  let box=$("concurrencyResult");
  btn.disabled=true;
  status.textContent="Executing 10 simultaneous requests...";
  box.classList.remove("hidden");
  box.innerHTML="<p>Firing 10 parallel HTTP POST requests with unique idempotency keys through Nginx...</p>";

  try {
    let eventsRes = await api("/events");
    let target = eventsRes.events.find(e=>e.name.includes("Concurrency Stress Test")) || eventsRes.events[0];
    let beforeSeats = Number(target.available_seats);

    let promises = [];
    let start = Date.now();
    for(let i=1; i<=10; i++){
      let reqKey = "concurrent-" + Date.now() + "-" + i;
      promises.push((async()=>{
        let t0 = Date.now();
        try {
          let r = await api(`/events/${target.id}/register`, {
            method: "POST",
            headers: {"Idempotency-Key": reqKey},
            body: JSON.stringify({quantity: 1})
          });
          return {req: i, status: 201, message: "Booked (Confirmed)", servedBy: r.servedBy, regId: r.registration?.id, latency: Date.now()-t0};
        } catch(err) {
          return {req: i, status: err.status || 409, message: err.message, servedBy: err.data?.servedBy || "app", latency: Date.now()-t0};
        }
      })());
    }

    let results = await Promise.all(promises);
    let afterRes = await api(`/events/${target.id}`);
    let afterSeats = Number(afterRes.event.available_seats);

    let successes = results.filter(r=>r.status===201).length;
    let rejected = results.filter(r=>r.status===409).length;

    let html = `<div style="display:flex;gap:20px;margin-bottom:12px">
      <div><b>Target Event:</b> ${esc(target.name)}</div>
      <div><b>Initial Seats:</b> ${beforeSeats}</div>
      <div><b>Final Seats:</b> ${afterSeats}</div>
      <div><b style="color:var(--ok)">Succeeded (201):</b> ${successes}</div>
      <div><b style="color:var(--bad)">Rejected (409):</b> ${rejected}</div>
    </div>
    <table class="table" style="background:#fff;border-radius:10px;overflow:hidden">
      <thead><tr><th>#</th><th>Status</th><th>Result</th><th>Served By</th><th>Latency</th></tr></thead>
      <tbody>
        ${results.map(r=>`<tr><td>Request ${r.req}</td><td><span class="pill ${r.status===201?'green':'red'}">HTTP ${r.status}</span></td><td>${esc(r.message)} ${r.regId?'(#'+r.regId+')':''}</td><td><b>${r.servedBy}</b></td><td>${r.latency}ms</td></tr>`).join("")}
      </tbody>
    </table>`;

    box.innerHTML = html;
    status.textContent = `Completed! ${successes} succeeded, ${rejected} rejected. Zero overbooking.`;
  } catch(e){
    box.innerHTML = `<div style="color:var(--bad)">Error: ${esc(e.message)}</div>`;
    status.textContent = "Test encountered error";
  } finally {
    btn.disabled=false;
  }
}

async function runRateLimitTest(){
  let out=$("rateLimitResult");
  out.textContent="Sending 10 rapid requests to /api/demo/rate-limit-test...\n";
  let log = [];
  for(let i=1; i<=10; i++){
    try {
      let r = await fetch("/api/demo/rate-limit-test");
      let d = await r.json().catch(()=>({}));
      let st = r.status;
      log.push(`Req ${i}: HTTP ${st} ${st===200?'[OK - Under Limit]':'[BLOCKED - 429 Too Many Requests]'}`);
    } catch(e){
      log.push(`Req ${i}: Network error`);
    }
  }
  out.textContent = log.join("\n");
}

async function runLoadBalancerProbe(){
  let out=$("probeResult");
  out.textContent="Probing Nginx cluster (12 requests)...\n";
  let counts = {};
  for(let i=1; i<=12; i++){
    try {
      let r = await fetch("/health");
      let d = await r.json();
      let node = d.instance || "unknown";
      counts[node] = (counts[node]||0) + 1;
    } catch(e){}
  }
  let lines = ["Distribution across instances:"];
  for(let [k,v] of Object.entries(counts)){
    lines.push(`  ${k}: ${v} requests (${Math.round(v/12*100)}%)`);
  }
  out.textContent = lines.join("\n");
}
